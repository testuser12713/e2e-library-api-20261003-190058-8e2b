# office-crew-ci-gates: strict-v10
# Auto-generated by office-crew orchestrator — Quality Pack v5 (GitHub Actions).
name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi
      - run: pip install pytest pytest-cov httpx2 httpx
      - run: PYTHONPATH=. pytest -v --cov=. --cov-report=term
      - shell: bash
        run: |
          export OFFICE_CREW_RC_STACKS='python'
          if [ ! -f RUN.json ]; then echo "No RUN.json — skip"; exit 0; fi
          OFFICE_CREW_PY=$(command -v python3 || command -v python)
          if [ -z "$OFFICE_CREW_PY" ]; then echo "No python on this runner — run contract skipped"; exit 0; fi
          "$OFFICE_CREW_PY" - <<'OFFICE_CREW_RUN_CONTRACT'
          import json, os, secrets, subprocess, sys, time, urllib.request, urllib.error

          try:
              doc = json.load(open("RUN.json", encoding="utf-8"))
          except Exception as e:
              sys.exit("RUN.json is not readable JSON: %s" % e)
          if doc.get("runcontract") != 1:
              print("RUN.json is not an office-crew run contract — skip"); raise SystemExit(0)

          scopes = {s.strip() for s in (os.environ.get("OFFICE_CREW_RC_STACKS") or "").split(",") if s.strip()}

          failures = []
          started = []
          deferred = []
          for svc in doc.get("services", []):
              name, where = svc.get("name", "?"), svc.get("dir", ".")
              if svc.get("kind") != "server" or not svc.get("start"):
                  continue
              stack = svc.get("stack") or "?"
              if scopes and stack not in scopes:
                  deferred.append("%s (%s)" % (name, stack))
                  print("%s: stack '%s' is not installed in this job - deferred to the pre-merge "
                        "gate, which runs its RUN.json install steps" % (name, stack))
                  continue
              if not os.path.isdir(where):
                  print("%s: %s/ not on this branch — skip" % (name, where)); continue
              port = int(svc.get("port") or 8000)
              env = dict(os.environ)
              for key, spec in (svc.get("env") or {}).items():
                  if spec.get("external"):
                      continue          # the product must boot WITHOUT it — that is the test
                  if spec.get("generate"):
                      env[key] = secrets.token_hex(int(spec.get("bytes") or 32))
                  else:
                      env[key] = str(spec.get("dev", ""))
              if svc.get("port_env"):
                  env[svc["port_env"]] = str(port)
              argv = [a.replace("${python}", sys.executable).replace("${PORT}", str(port))
                      for a in svc["start"]]
              if any("${" in a for a in argv):
                  failures.append("%s: unresolved placeholder in start" % name); continue
              print("::group::%s" % name); print("starting:", " ".join(argv))
              proc = subprocess.Popen(argv, cwd=where, env=env,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                                      start_new_session=True)
              path = (svc.get("health") or {}).get("path") or "/"
              want = set((svc.get("health") or {}).get("expect_status") or [200])
              deadline = time.time() + min(int(svc.get("ready_timeout_s") or 30), 60)
              status = None
              try:
                  while time.time() < deadline and proc.poll() is None:
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:%d%s" % (port, path), timeout=2) as r:
                              status = r.status
                      except urllib.error.HTTPError as he:
                          status = he.code
                      except OSError:
                          time.sleep(0.5); continue
                      break
                  if proc.poll() is not None:
                      failures.append("%s: exited with %s before answering %s" % (name, proc.returncode, path))
                  elif status is None:
                      failures.append("%s: never answered %s within the declared timeout" % (name, path))
                  elif status not in want:
                      failures.append("%s: %s answered %s, RUN.json expects %s"
                                      % (name, path, status, sorted(want)))
                  else:
                      started.append(name)
                      print("%s: %s answered %s" % (name, path, status))
              finally:
                  try:
                      os.killpg(os.getpgid(proc.pid), 9)
                  except Exception:
                      pass
                  if proc.poll() is None:
                      proc.kill()
                  try:
                      out = (proc.communicate(timeout=15)[0] or "")[-2000:]
                  except Exception:
                      out = "(output not drained: the product left a child holding the pipe)"
                  if out.strip():
                      print(out)
                  print("::endgroup::")

          if failures:
              sys.exit("the product does not start the way RUN.json says:\n- " + "\n- ".join(failures))
          print("run contract: started and probed %s" % (", ".join(started) if started else "nothing"))
          if deferred:
              print("run contract: NOT checked here (wrong job for the stack): %s" % ", ".join(deferred))
          OFFICE_CREW_RUN_CONTRACT
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.16.0
      - run: ruff format --check . || true
      - run: ruff check --select E9,F,B --ignore B008 .
      - run: ruff check . || true
  types:
    runs-on: ubuntu-latest
    continue-on-error: true  # warning only for now
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: pip install mypy
      - run: mypy --install-types --non-interactive --ignore-missing-imports --check-untyped-defs --warn-unused-ignores --warn-redundant-casts --explicit-package-bases . || true
  security:
    runs-on: ubuntu-latest
    continue-on-error: true  # warning only for now
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit bandit
      - run: if [ -f requirements.txt ]; then pip-audit -r requirements.txt --strict || true; fi
      - run: bandit -r . -ll --exclude .venv,venv,build,dist,tests || true
